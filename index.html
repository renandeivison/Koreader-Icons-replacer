<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personalizador de ícones do KOReader</title>
<style>
:root{--bg:#eceef0;--surf:#f8f9fa;--ink:#14171c;--mut:#5b616b;--line:#cdd1d6;--acc:#0b5cad;--on:#127a4b;--screen:#e6e6e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--surf:#1a1d21;--ink:#e9ecf0;--mut:#9aa1ab;--line:#2e3339;--acc:#7db4ff;--on:#5fd39a;--screen:#d9d9d4;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;margin:0}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
header.top{padding:34px 0 18px}
h1{font-size:2rem;letter-spacing:-.015em;line-height:1.15}
.lede{margin:8px 0 0;color:var(--mut);max-width:60ch}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sticky .wrap{display:flex;flex-direction:column;gap:8px;padding-top:10px;padding-bottom:10px}
.tabs{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surf)}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--mut);padding:7px 16px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.badge{font-size:.72rem;font-weight:600;min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:var(--on);color:#fff}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.chips a{white-space:nowrap;padding:4px 10px;border-radius:6px;color:var(--mut);text-decoration:none;font-size:.85rem}
.chips a:hover{background:var(--surf);color:var(--ink)}
button:focus-visible,a:focus-visible,summary:focus-visible,label.pick:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding-bottom:30px}
.how{margin:22px 0 6px;padding:16px 18px;background:var(--surf);border:1px solid var(--line);border-radius:12px}
.how h3{font:600 .95rem system-ui;margin:0 0 10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
.how li{counter-increment:s;padding-left:30px;position:relative;font-size:.88rem;color:var(--mut)}
.how li::before{content:counter(s);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--ink)}
.how li>b{display:block;color:var(--ink);font-size:.9rem}
.how li span b{display:inline;font-size:inherit}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.lang{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mut);flex:none;margin-top:6px}
.lang select{font:inherit;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.note{margin:12px 0 0;font-size:.82rem;color:var(--mut)}
.pn{font:500 .82rem system-ui;color:var(--mut);display:flex;gap:8px;align-items:center}
.pn input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:150px}
details.sec{margin-top:26px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 3px}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec.closing>summary::before{transform:rotate(-45deg)}
summary .t{flex:1;min-width:0}
summary h2{font-size:1.15rem}
.sub{margin:1px 0 0;color:var(--mut);font-size:.84rem}
summary .tot{font-size:.8rem;color:var(--mut);white-space:nowrap}
summary .n{font-size:.8rem;color:var(--on);font-weight:600;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card.on{border-color:var(--on);box-shadow:inset 3px 0 0 var(--on)}
.pair{display:flex;align-items:center;justify-content:space-between;gap:6px}
.box{width:62px;height:62px;border-radius:8px;display:grid;place-items:center;background:var(--screen);flex:none}
.box img{width:40px;height:40px;object-fit:contain}
.box .hint{color:#777;font-size:.9rem}
.arrow{color:var(--mut);font-size:.9rem}
.nm{font-weight:600;font-size:.86rem;line-height:1.25;word-break:break-word}
.fn{font-size:.74rem;color:var(--mut);word-break:break-all;margin-top:2px}
.meta{flex:1}
.row{display:flex;gap:6px;align-items:center}
button,label.pick{font:inherit;font-size:.82rem;cursor:pointer}
label.pick{flex:1;text-align:center;padding:6px 8px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:transparent}
label.pick:hover{border-color:var(--acc);color:var(--acc)}
label.pick input{display:none}
.rm{border:0;background:transparent;color:var(--mut);text-decoration:underline;padding:4px}
.bar{position:sticky;bottom:0;z-index:5;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.bar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#cnt{color:var(--mut);font-size:.88rem}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){details.sec>summary::before{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<div class="toprow"><h1 data-i="title"></h1>
<label class="lang"><span data-i="language"></span><select id="lang"></select></label></div>
<p class="lede" data-i="lede"></p>
</div></header>
<div class="sticky"><div class="wrap">
<div class="tabs" role="tablist">
<button role="tab" id="t-ko" aria-selected="true" data-tab="ko">KOReader <span class="badge" hidden></span></button>
<button role="tab" id="t-sui" aria-selected="false" data-tab="sui">SimpleUI <span class="badge" hidden></span></button>
</div>
<div class="chips" id="nav-ko"></div>
<div class="chips" id="nav-sui" hidden></div>
</div></div>
<main class="wrap">
<div id="pane-ko">
<div class="how"><h3><span data-i="how"></span></h3>
<ol><li><b data-i="k1t"></b><span data-i="k1b"></span></li><li><b data-i="k2t"></b><span data-i="k2b"></span></li><li><b data-i="k3t"></b><span data-i="k3b"></span></li></ol>
<p class="note" data-i="knote"></p></div>
<div id="sec-ko"></div>
</div>
<div id="pane-sui" hidden>
<div class="how"><h3><span data-i="how"></span><label class="pn"><span data-i="packname"></span> <input id="packname" value="MyPack" maxlength="30"></label></h3>
<ol><li><b data-i="s1t"></b><span data-i="s1b"></span></li><li><b data-i="s2t"></b><span data-i="s2b"></span></li><li><b data-i="s3t"></b><span data-i="s3b"></span></li></ol>
<p class="note" data-i="snote"></p></div>
<div id="sec-sui"></div>
</div>
</main>
<div class="bar"><div class="wrap">
<span id="cnt">Nenhum ícone alterado</span>
<div class="acts">
<button class="btn" id="clr" hidden>Limpar</button>
<button class="btn" id="sec">Baixar pack padrão</button>
<button class="btn primary" id="prim" disabled>Gerar zip</button>
</div>
</div></div>

let lang="en";
try{const l=localStorage.getItem("koicons-lang");if(l&&UI[l])lang=l}catch(e){}
const t=(k,v)=>{const s=(UI[lang]&&UI[lang][k])??UI.en[k];return v==null?s:s.replace("{n}",v)};
const secText=(p,i)=>(SECT[p][lang]||SECT[p].en)[i];
const labelOf=n=>((LAB[lang]||{})[n])||SUI_LABEL[n]||n;
const refs=[],cardNm={},pickTxt=[],rmTxt=[];
const $i=id=>document.getElementById(id);
const cards={};let tab="ko";
function build(list,pane,strip){
 const nav=$i("nav-"+pane),main=$i("sec-"+pane);
 list.forEach(([title,sub,names],i)=>{
  [title,sub]=secText(pane,i);
  const id=pane+"-"+i;
  const a=$("a","",title);a.href="#"+id;nav.append(a);
  a.addEventListener("click",()=>{$i(id).open=true});
  const sec=$("details","sec");sec.id=id;sec.open=true;
  const sm=$("summary");
  sm.innerHTML="<div class='t'><h2></h2><p class='sub'></p></div><span class='tot'></span><span class='n'></span>";
  sm.querySelector("h2").textContent=title;sm.querySelector(".sub").textContent=sub;
  sec.append(sm);
  const ref={pane,i,a,h2:sm.querySelector("h2"),sub:sm.querySelector(".sub"),tot:sm.querySelector(".tot"),total:0};refs.push(ref);
  const g=$("div","grid");let tot=0;
  names.forEach(n=>{
   const pv=ORIG[n]||SUI_PREV[n],lb=SUI_LABEL[n];
   if(!pv&&!lb)return;
   tot++;
   const c=$("div","card");
   const pair=$("div","pair");
   const o=$("div","box");
   if(pv){const oi=new Image();oi.alt=n;oi.src=svgUrl(pv);o.append(oi)}else o.innerHTML="<span class='hint'>?</span>";
   const ar=$("span","arrow","→");
   const nb=$("div","box");nb.style.opacity=".4";nb.innerHTML="<span class='hint'>—</span>";
   pair.append(o,ar,nb);
   const meta=$("div","meta");
   const t1=$("div","nm");t1.textContent=labelOf(n);meta.append(t1);cardNm[n]=t1;
   if(lb){const t2=$("div","fn");t2.textContent=n;meta.append(t2)}
   const row=$("div","row");
   const lab=$("label","pick");const lt=$("span");lab.append(lt);pickTxt.push(lt);
   const inp=document.createElement("input");inp.type="file";inp.accept=".svg,.png,image/svg+xml,image/png";
   lab.append(inp);
   const rm=$("button","rm");rmTxt.push(rm);rm.hidden=true;
   row.append(lab,rm);
   c.append(pair,meta,row);g.append(c);
   inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    const ext=f.name.toLowerCase().endsWith(".png")?"png":f.name.toLowerCase().endsWith(".svg")?"svg":null;
    if(!ext){alert(t("badfile"));inp.value="";return}
    const bytes=new Uint8Array(await f.arrayBuffer());
    const url=URL.createObjectURL(new Blob([bytes],{type:ext=="svg"?"image/svg+xml":"image/png"}));
    chosen[n]={ext,bytes,url};
    nb.style.opacity="1";nb.innerHTML="";const im=new Image();im.src=url;im.alt="novo "+n;nb.append(im);
    c.classList.add("on");rm.hidden=false;upd();
   };
   rm.onclick=()=>{delete chosen[n];inp.value="";nb.style.opacity=".4";nb.innerHTML="<span class='hint'>—</span>";c.classList.remove("on");rm.hidden=true;upd()};
   cards[n]=rm;
  });
  ref.total=tot;
  sec.append(g);main.append(sec);
  sm.addEventListener("click",e=>{e.preventDefault();toggle(sec,g)});
 });
}
build(SECTIONS,"ko",false);
build(SUI_SECTIONS,"sui",true);
function toggle(d,g){
 const opening=!d.open||d.classList.contains("closing");
 if(g._a)g._a.cancel();
 d.classList.remove("closing");
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){d.open=opening;return}
 g.style.overflow="hidden";
 const done=()=>{g.style.overflow="";g._a=null};
 if(opening){
  d.open=true;const h=g.offsetHeight;
  g._a=g.animate([{height:"0px",opacity:0,transform:"translateY(-6px)"},{height:h+"px",opacity:1,transform:"none"}],{duration:260,easing:"cubic-bezier(.2,.7,.2,1)"});
  g._a.onfinish=done;g._a.oncancel=done;
 }else{
  const h=g.offsetHeight;d.classList.add("closing");
  g._a=g.animate([{height:h+"px",opacity:1,transform:"none"},{height:"0px",opacity:0,transform:"translateY(-6px)"}],{duration:200,easing:"ease-in"});
  g._a.onfinish=()=>{d.open=false;d.classList.remove("closing");done()};
  g._a.oncancel=done;
 }
}
const isSui=n=>n.startsWith("sui_");
const cntTxt=n=>!n?t("none"):n==1?t("one"):t("many",n);
function upd(){
 document.querySelectorAll("details.sec").forEach(d=>{const c=d.querySelectorAll(".card.on").length;d.querySelector(".n").textContent=c?(c==1?t("chOne"):t("chMany",c)):""});
 const all=Object.keys(chosen),s=all.filter(isSui).length,k=all.length-s;
 [["ko",k],["sui",s]].forEach(([x,n])=>{const b=$i("t-"+x).querySelector(".badge");b.hidden=!n;b.textContent=n});
 const n=tab=="sui"?s:k;
 $i("prim").disabled=!n;$i("clr").hidden=!n;
 $i("prim").textContent=t(tab=="sui"?"genSui":"genKo");
 $i("cnt").textContent=cntTxt(n);
}
function setTab(t){
 tab=t;
 ["ko","sui"].forEach(x=>{$i("pane-"+x).hidden=x!=t;$i("nav-"+x).hidden=x!=t;$i("t-"+x).setAttribute("aria-selected",x==t)});
 window.scrollTo(0,0);upd();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$i("clr").onclick=()=>Object.keys(chosen).filter(n=>isSui(n)==(tab=="sui")).forEach(n=>cards[n].click());
function applyLang(){
 document.documentElement.lang=lang;document.title=t("title");
 document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=t(e.dataset.i));
 refs.forEach(r=>{const [a,b]=secText(r.pane,r.i);r.a.textContent=a;r.h2.textContent=a;r.sub.textContent=b;r.tot.textContent=r.total==1?t("totOne"):t("totMany",r.total)});
 for(const n in cardNm)cardNm[n].textContent=labelOf(n);
 pickTxt.forEach(e=>e.textContent=t("choose"));rmTxt.forEach(e=>e.textContent=t("remove"));
 $i("sec").textContent=t("defpack");
 upd();
}
const sel=$i("lang");

sel.value=lang;
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem("koicons-lang",lang)}catch(e){}applyLang()};

// ZIP mínimo (sem compressão), sem dependências
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function zip(files){
 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 const d=new Date(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){
  const nm=enc.encode(f.name),crc=CRC(f.data),sz=f.data.length;
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  parts.push(lh.buffer,nm,f.data);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
  cd.push(ch.buffer,nm);
  off+=30+nm.length+sz;
 }
 const cdSize=cd.reduce((s,p)=>s+p.byteLength,0);
 const e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e.buffer],{type:"application/zip"});
}
function dl(files,name){
 const url=URL.createObjectURL(zip(files));
 const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function suiPack(files,desc,fixed){
 const nm=fixed||($i("packname").value.replace(/[^A-Za-z0-9_-]/g,"")||"MyPack").slice(0,30);
 const enc=new TextEncoder();
 const lua='return {\n  name = "'+nm+'",\n  version = "1.0",\n  description = "'+desc+'",\n}\n';
 dl([{name:nm+"/pack.lua",data:enc.encode(lua)},...files.map(f=>({name:nm+"/"+f.name,data:f.data}))],nm+".zip");
}
const mine=()=>Object.entries(chosen).filter(([n])=>isSui(n)==(tab=="sui"));
$i("prim").onclick=()=>{
 if(tab=="ko")dl(mine().map(([n,v])=>({name:"koreader/icons/"+n+"."+v.ext,data:v.bytes})),"koreader-icons.zip");
 else suiPack(mine().map(([n,v])=>({name:n+"."+v.ext,data:v.bytes})),"Generated by KOReader Icon Customizer");
};
$i("sec").onclick=()=>{
 const enc=new TextEncoder();
 if(tab=="ko")dl(Object.keys(ORIG).map(n=>({name:"koreader/icons/"+n+".svg",data:enc.encode(ORIG[n])})),"koreader-icons-padrao.zip");
 else suiPack(Object.keys(SUI_PREV).map(n=>({name:n+".svg",data:enc.encode(SUI_PREV[n])})),"SimpleUI default icons","PadraoSimpleUI");
};
